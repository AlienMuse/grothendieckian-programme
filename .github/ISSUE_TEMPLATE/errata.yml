name: Erratum
description: Report a mistake in the text, a formula, a reference, or the typesetting.
title: "[Erratum] p. ?: "
labels: ["erratum"]
body:
  - type: markdown
    attributes:
      value: "This form is for the overview, The Grothendieckian Programme, and for this repository. An error in one of the seven works belongs to that work's own repository (see the README)."
  - type: dropdown
    id: file
    attributes:
      label: Where
      options:
        - The book (The-Grothendieckian-Programme-v1.0.0.pdf)
        - This repository (README, docs, programme.json, STATISTICS.md)
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: PDF page number
      description: For the book, the page number shown by your PDF reader (not the printed folio); for the repository, the file.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Chapter and section
      description: Chapter and section, or the figure, table or line.
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed correction and reason
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Name for the acknowledgements (optional)
      description: Leave empty if you prefer not to be named.
